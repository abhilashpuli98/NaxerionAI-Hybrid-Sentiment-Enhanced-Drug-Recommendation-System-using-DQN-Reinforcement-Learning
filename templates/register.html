{% extends "base.html" %}

{% block title %}Register - SEDRS{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-6 col-md-8">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle mb-3"
                style="width:72px;height:72px;">
                <i class="fas fa-user-plus text-primary fs-3"></i>
            </div>
            <h2 class="fw-bold">Create Account</h2>
            <p class="text-muted">Join SEDRS for AI-powered health insights</p>
        </div>

        <div class="card border-0 shadow-lg">
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('web.register') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            <i class="fas fa-envelope text-primary me-1"></i>Email Address
                        </label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email"
                            placeholder="you@example.com" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="fas fa-lock text-primary me-1"></i>Password
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="password" name="password"
                                placeholder="Create a strong password" required minlength="6">
                            <button class="btn btn-outline-secondary password-toggle-btn" type="button">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength-bar mt-2">
                            <div class="strength-fill"></div>
                        </div>
                        <div class="password-strength-text"></div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label fw-semibold">
                            <i class="fas fa-check-double text-primary me-1"></i>Confirm Password
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="confirm_password"
                                name="confirm_password" placeholder="Repeat your password" required>
                            <button class="btn btn-outline-secondary password-toggle-btn" type="button">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div id="passwordMatchIndicator" class="small mt-1"></div>
                    </div>

                    <hr class="my-3">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="age" class="form-label fw-semibold">
                                <i class="fas fa-birthday-cake text-primary me-1"></i>Age
                            </label>
                            <input type="number" class="form-control" id="age" name="age" min="1" max="120"
                                placeholder="e.g. 30">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="gender" class="form-label fw-semibold">
                                <i class="fas fa-venus-mars text-primary me-1"></i>Gender
                            </label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="" selected>Select...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="medical_conditions" class="form-label fw-semibold">
                            <i class="fas fa-notes-medical text-primary me-1"></i>Medical Conditions
                        </label>
                        <textarea class="form-control" id="medical_conditions" name="medical_conditions" rows="2"
                            placeholder="e.g. Diabetes, Hypertension (optional)"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="allergies" class="form-label fw-semibold">
                            <i class="fas fa-allergies text-primary me-1"></i>Allergies
                        </label>
                        <input type="text" class="form-control" id="allergies" name="allergies"
                            placeholder="e.g. Penicillin, Nuts (optional)">
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label text-muted small" for="terms">
                            I agree to the <a href="#" class="text-primary">Terms of Service</a> and
                            <a href="#" class="text-primary">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                        <i class="fas fa-user-plus me-2"></i>Create Account
                    </button>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted">
                Already have an account?
                <a href="{{ url_for('web.login') }}" class="text-primary fw-semibold text-decoration-none">
                    Sign in <i class="fas fa-arrow-right ms-1"></i>
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
