{% extends "base.html" %}

{% block title %}Login - SEDRS{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-5 col-md-7">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle mb-3"
                style="width:72px;height:72px;">
                <i class="fas fa-sign-in-alt text-primary fs-3"></i>
            </div>
            <h2 class="fw-bold">Welcome Back</h2>
            <p class="text-muted">Sign in to your SEDRS account</p>
        </div>

        <div class="card border-0 shadow-lg">
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('web.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            <i class="fas fa-envelope text-primary me-1"></i>Email Address
                        </label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email"
                            placeholder="Enter your email" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="fas fa-lock text-primary me-1"></i>Password
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="password" name="password"
                                placeholder="Enter your password" required>
                            <button class="btn btn-outline-secondary password-toggle-btn" type="button">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                        <label class="form-check-label text-muted" for="remember_me">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted">
                Don't have an account?
                <a href="{{ url_for('web.register') }}" class="text-primary fw-semibold text-decoration-none">
                    Create one now <i class="fas fa-arrow-right ms-1"></i>
                </a>
            </p>
        </div>

        <div class="text-center mt-2">
            <small class="text-muted">
                <i class="fas fa-keyboard me-1"></i>
                <span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">D</span> Dashboard
                &middot;
                <span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">A</span> Analyze
            </small>
        </div>
    </div>
</div>
{% endblock %}
